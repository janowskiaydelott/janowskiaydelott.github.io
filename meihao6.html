<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>666跳转中...</title>
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f7f8fc 0%, #eef2ff 100%);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        .card {
            background: #ffffff;
            width: 90%;
            max-width: 480px;
            padding: 48px 32px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            text-align: center;
        }
        /* Loading转圈动画 */
        .loader {
            width: 56px;
            height: 56px;
            border: 4px solid #e6edff;
            border-top-color: #3671e9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin {
            to {transform: rotate(360deg);}
        }
        h2 {
            font-size: 24px;
            color: #1d2939;
            margin-bottom: 12px;
        }
        .desc {
            font-size: 15px;
            color: #667085;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .error-text {
            font-size: 18px;
            color: #d92d20;
            margin-bottom: 20px;
        }
        .btn-link {
            display: inline-block;
            padding: 14px 36px;
            background-color: #3671e9;
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.25s ease;
        }
        .btn-link:hover {
            background-color: #2859c4;
        }
        .tip-small {
            margin-top: 16px;
            font-size: 13px;
            color: #98a2b3;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="loader" id="loadingIcon"></div>
        <h2>正在前往注册页面</h2>
        <p class="desc" id="descText">系统正在分析最佳线路，请稍候...</p>
        <p class="error-text" id="errorMsg"></p>
        <a href="" class="btn-link" id="manualLink" style="display:none;">点击继续访问</a>
        <p class="tip-small">跳转时请勿点击手机上返回按钮</p>
    </div>

<script>
// ======================域名配置区======================
const DOMAIN_LIST = [
"https://d6d8o2g3.txbm.shop",
"https://s2h4b8u1.txbm.shop",
"https://y6t5k9h9.txbm.shop",
"https://o2q0f6z7.txbm.shop",
"https://y4z4g4q8.txbm.shop",
"https://y7r5a7u1.txbm.shop",
"https://d7t8p9l4.txbm.shop",
"https://y8q6b7t2.txbm.shop",
"https://z4t5y0b5.txbm.shop",
"https://t4n1p5p7.txbm.shop",
"https://t4j8l5i3.txbm.shop",
"https://p6a7q8x0.txbm.shop",
"https://z4b9p5o4.txbm.shop",
"https://k8f7p5n4.txbm.shop",
"https://s8o0j8k7.txbm.shop",
"https://t2e5n8z4.txbm.shop",
"https://i2m2q0a4.txbm.shop",
"https://z1r0q1p7.txbm.shop",

    // 配置链接格式，例如："https://xxx.com",
];
const DEFAULT_INVITE = "";
// =================================================================

// 每次随机抽取 count 个不重复的域名作为测速候选
function pickRandomDomains(count){
    const pool = DOMAIN_LIST.slice();
    const picked = [];
    while(picked.length < count && pool.length){
        const i = Math.floor(Math.random() * pool.length);
        picked.push(pool.splice(i, 1)[0]);
    }
    return picked;
}

// 测单个域名响应耗时（no-cors 请求只需服务器有响应即可，失败/超时返回 null）
function testDomainSpeed(domain, timeout){
    return new Promise((resolve) => {
        const start = Date.now();
        let done = false;
        const finish = (result) => {
            if(!done){ done = true; clearTimeout(timer); resolve(result); }
        };
        const timer = setTimeout(() => finish(null), timeout);
        fetch(domain + '/favicon.ico?_t=' + Date.now(), { mode: 'no-cors', cache: 'no-store' })
            .then(() => finish(Date.now() - start))
            .catch(() => finish(null));
    });
}

// 随机抽 6 个域名并发测速，返回最快的可用域名（全部失败则随机兜底）
async function findFastestDomain(){
    const candidates = pickRandomDomains(6);
    const times = await Promise.all(candidates.map(d => testDomainSpeed(d, 5000)));

    let fastest = null, fastestTime = Infinity;
    times.forEach((t, i) => {
        if(t !== null && t < fastestTime){ fastestTime = t; fastest = candidates[i]; }
    });
    return fastest || pickRandomDomains(1)[0];
}

(async function(){
    const queryRaw = window.location.search.slice(1);
    let inviteCode = DEFAULT_INVITE;

    if(queryRaw){
        const realParamStr = queryRaw.split("?").pop();
        const innerParams = new URLSearchParams(realParamStr);
        inviteCode = innerParams.get('invite') || DEFAULT_INVITE;
    }

    const errorDom = document.getElementById("errorMsg");
    const linkDom = document.getElementById('manualLink');
    const loadingIcon = document.getElementById('loadingIcon');
    const descDom = document.getElementById('descText');

    if(!inviteCode){
        errorDom.innerText = "未识别到有效邀请参数";
        loadingIcon.style.display = "none";
        return;
    }

    descDom.innerText = "正在检测最快线路，请稍候...";

    const fastestDomain = await findFastestDomain();
    const targetUrl = `${fastestDomain}/register.php?invite=${inviteCode}`;

    linkDom.href = targetUrl;
    linkDom.style.display = "inline-block";

    // 微信内置浏览器：拦截"页面加载后立即JS自动跳转"的行为，
    // 所以微信里不自动跳，改为用户手动点击按钮（正常点击导航不会触发拦截）
    const isWeChat = /MicroMessenger/i.test(navigator.userAgent);
    if(isWeChat){
        loadingIcon.style.display = "none";
        descDom.innerText = "已选定最快线路，请点击下方按钮继续访问";
        return;
    }

    // 非微信环境：原页面跳转（replace 不在历史记录留下中转页）
    descDom.innerText = "已选定最快线路，正在跳转...";
    window.location.replace(targetUrl);
})();
</script>
</body>
</html>
